name: Build & deploy

# push στο main → build και deploy στο Cloudflare
# pull request  → μόνο build (έλεγχος ότι δεν σπάει τίποτα) + προεπισκόπηση στο Cloudflare
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      # σε PR ακυρώνεται το παλιό build όταν έρθει νέο commit· στο main κανένα deploy δεν κόβεται στη μέση
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Ορίζονται στο GitHub: Settings → Secrets and variables → Actions.
      # Όσο λείπουν, τα βήματα του Cloudflare απλώς παραλείπονται.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Όλο το ιστορικό: το sitemap παίρνει το <lastmod> κάθε σελίδας από το git
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npx eleventy
      # Τεστ μετά το build (το τεστ του CSP διαβάζει το _site). Αν αποτύχει, το PR
      # βγαίνει κόκκινο και, στο main, δεν γίνεται deploy.
      - name: Run tests
        run: npm test

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      # Κάθε PR παίρνει δική του διεύθυνση: pr-<αριθμός>-dese-kordonia.<subdomain>.workers.dev
      - name: Preview on Cloudflare
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler versions upload --preview-alias pr-${{ github.event.number }}
